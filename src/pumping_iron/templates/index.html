{% extends "base.html" %}
{% block content %}
<section class="hero">
  <h1>Что на штанге сегодня?</h1>
  <p>Каждый блин ведёт в свой раздел.</p>
  <div class="barbell">
    <div class="bar"></div>
    <div class="collar"></div>
    {% for item in nav %}
      <a class="plate plate-{{ item.plate }}" href="{{ item.path }}" style="--i: {{ loop.index0 }}">{{ item.title }}</a>
    {% endfor %}
    <div class="sleeve"></div>
  </div>
</section>
{% endblock %}
