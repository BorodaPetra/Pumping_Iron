<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pumping Iron{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="/">Pumping Iron</a>
    {% for path, title in nav %}
      <a href="{{ path }}" class="{{ 'active' if current == path }}">{{ title }}</a>
    {% endfor %}
  </nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
